name: Build portable apps
on:
  workflow_dispatch:
  push:
    branches: ['codex/portable-apps']
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
          - os: macos-15
            name: macOS-arm64
          - os: macos-15-intel
            name: macOS-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group build --python 3.14 --no-install-package openai-codex-cli-bin
      - run: uv run --no-sync python -m unittest discover -s tests
        env:
          PYTHONUTF8: '1'
      - run: uv run --no-sync python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: QuizChirp-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.sha256
